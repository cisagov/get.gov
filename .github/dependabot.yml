# .github/dependabot.yml
#
# Keeps SHA-pinned GitHub Actions current. Dependabot rewrites both the SHA and
# the trailing `# vX.Y.Z` comment, so pinning costs nothing in maintenance.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
